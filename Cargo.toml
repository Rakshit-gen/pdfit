[package]
name = "pdfit"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Shrink a PDF to fit an upload limit by recompressing only its images, leaving text and line art untouched"

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8", optional = true }
clap = { version = "4.6.7", features = ["derive"] }
flate2 = "1.1.10"
image = { version = "0.25.10", default-features = false }
jpeg-decoder = "0.3.2"
jpeg-encoder = "0.7.1"
lopdf = { version = "0.45", default-features = false }
rayon = "1.12.0"
rust-embed = { version = "8", features = ["mime-guess"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"], optional = true }
tower-http = { version = "0.6", features = ["fs"], optional = true }

[features]
web = ["dep:axum", "dep:tokio", "dep:tower-http", "dep:rust-embed"]

[[bin]]
name = "pdfit-web"
path = "src/bin/web.rs"
required-features = ["web"]

[dev-dependencies]
tempfile = "3.27.0"

# Image decoding and resizing are painfully slow unoptimised; this keeps
# `cargo test` quick. The crate itself needs it too, because the generic
# resize and JPEG code is compiled into it, not into the dependencies.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

